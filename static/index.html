<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>危险品船进港调度台账</title>
<style>
body{font-family:system-ui,sans-serif;margin:24px;color:#1a2733}
h1{font-size:20px}
table{border-collapse:collapse;width:100%;margin-top:12px;font-size:13px}
th,td{border:1px solid #d4dde5;padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f2f6fa}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.released,.berthed{background:#dff3e3}.blocked,.void{background:#fde2e1}
.draft{background:#fdf3d3}.completed,.cancelled{background:#e9edf1}
code{background:#f2f6fa;padding:1px 4px;border-radius:3px}
</style>
</head>
<body>
<h1>危险品船进港调度台账（事件溯源）</h1>
<p>放行前原子预占 <code>航道区段 + 泊位净空 + 护航拖轮</code>；缺项停在待补；封航/富余水深/危险品类别变更后未靠泊安排作废重排。</p>
<button onclick="load()">刷新台账</button>
<table id="plans"><thead><tr>
<th>计划</th><th>版本</th><th>状态</th><th>船/类别</th><th>航道/泊位</th><th>窗</th><th>占位</th><th>待补原因 / 冲突</th><th>放行依据</th>
</tr></thead><tbody></tbody></table>
<script>
const stateName={draft:'草稿',blocked:'待补',released:'已放行',berthed:'已靠泊',completed:'已完成',void:'已作废',cancelled:'已取消'};
async function load(){
  const r=await fetch('/api/plans',{headers:{'X-User-Id':'web','X-Role':'dispatcher'}});
  const d=await r.json();
  const tb=document.querySelector('#plans tbody');
  tb.innerHTML='';
  d.items.forEach(p=>{
    const issues=(p.reasons||[]).map(x=>x.message).concat((p.conflicts||[]).map(x=>
      '冲突:'+x.resource_type+'/'+x.resource_id+' 被 '+x.held_by.plan_ref+' 占用')).join('<br>');
    tb.insertAdjacentHTML('beforeend',`<tr>
      <td>${p.plan_ref}</td><td>#${p.revision}</td>
      <td><span class="tag ${p.state}">${stateName[p.state]||p.state}</span></td>
      <td>${p.params.vessel}<br>IMDG ${p.params.dg_class}</td>
      <td>${p.params.channel_id} / ${p.params.berth_id}</td>
      <td>${p.params.start_hour}–${p.params.end_hour}h</td>
      <td>${(p.holds||[]).map(h=>h.resource_type+':'+h.resource_id).join(', ')}</td>
      <td>${issues}</td>
      <td>${p.basis?('UKC≥'+p.basis.required_ukc_m+'m，拖轮'+p.basis.required_tugs+'艘'):''}</td>
    </tr>`);
  });
}
load();
</script>
</body>
</html>
